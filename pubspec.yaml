name: flutter_restaurant_pos
description: "Rest POS - High-performance, offline-first Restaurant POS & Management App with Material 3 design."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/branding/
    - assets/icon/
    - assets/menu/beverages/
    - assets/menu/biryani/
    - assets/menu/burger/
    - assets/menu/chicken/
    - assets/menu/chinese/
    - assets/menu/desserts/
    - assets/menu/egg/
    - assets/menu/fish-seafood/
    - assets/menu/indian-bread/
    - assets/menu/mutton/
    - assets/menu/noodles/
    - assets/menu/pizza/
    - assets/menu/rice/
    - assets/menu/salad/
    - assets/menu/sandwich/
    - assets/menu/snacks/
    - assets/menu/soup/
    - assets/menu/starters/
    - assets/menu/vegetarian/

